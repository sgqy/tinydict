[package]
name = "tinydict"
default-run = "tinydict"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland", "persistence"] }
env_logger = "0.11"
log = "0.4"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tinydict-core.workspace = true
tinydict-data.workspace = true
tempfile = "3"

[lints]
workspace = true
