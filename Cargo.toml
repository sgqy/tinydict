[workspace]
members = ["crates/core", "crates/data", "crates/app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/sgqy/tinydict"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tinydict-core = { path = "crates/core" }
tinydict-data = { path = "crates/data" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

