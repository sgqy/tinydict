[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tinydict-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

